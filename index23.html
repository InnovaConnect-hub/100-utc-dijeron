<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 UTC Dijeron</title>
    <style>
        /* Fondo Vibrante Llamativo */
        body {
            background: linear-gradient(135deg, #07002b 0%, #170066 50%, #090979 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Título con Neón */
        h1 {
            color: #FFD700;
            font-size: 3.5em;
            margin: 5px 0 20px 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 2px 2px 5px black;
            letter-spacing: 3px;
        }

        /* Marcadores Superiores */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 95%;
            max-width: 1100px;
            margin: 0 auto 30px auto;
        }

        .team {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 40px;
            border: 3px solid #ff007f; /* Acento rosa neón */
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            min-width: 200px;
        }

        .team-name { 
            font-size: 1.5em; 
            font-weight: bold; 
            color: #ffb3d9;
            letter-spacing: 1px; 
            text-transform: uppercase;
        }
        
        .score { 
            font-size: 3.5em; 
            color: #00ffff; /* Cian brillante */
            font-weight: bold; 
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); 
        }

        .ronda-info {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            padding: 15px 30px;
            border-radius: 10px;
            max-width: 450px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        
        .ronda-titulo { font-size: 1.8em; color: #00ffff; font-weight: bold; margin-bottom: 5px; }
        .pregunta-secreta { font-size: 1.1em; color: #FFD700; font-style: italic; }

        /* TABLERO: CSS Grid Soluciona el error visual */
        .board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
        }

        /* Contenedor estricto para evitar colapso de la animación */
        .answer-container {
            perspective: 1200px;
            height: 75px; /* Altura fija obligatoria */
            width: 100%;
            cursor: pointer;
        }

        /* Si el número de respuestas es impar, centramos la última */
        .answer-container:last-child:nth-child(odd) {
            grid-column: 1 / -1;
            justify-self: center;
            width: 49%; /* Para que mida igual que una columna */
        }

        .flipper {
            position: relative; /* Clave para que los absolutos funcionen */
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .answer-container.flipped .flipper {
            transform: rotateX(180deg);
        }

        /* Caras de las tarjetas con posición absoluta */
        .front, .back {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            border-radius: 12px;
            box-sizing: border-box; /* Evita que el padding rompa el tamaño */
        }

        .front {
            background: linear-gradient(90deg, #0a0a3a 0%, #1a1a66 100%);
            border: 3px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            justify-content: center;
        }

        .number {
            background: #000;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .back {
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: 4px solid #fff;
            transform: rotateX(180deg);
            justify-content: space-between;
            padding: 0 25px;
            font-size: 1.8em;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }

        .points-badge {
            background: #000;
            color: #00ffff;
            padding: 5px 20px;
            border-radius: 8px;
            border: 2px solid #00ffff;
            font-size: 1.1em;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        /* Gran X Roja mejorada */
        #strike-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .big-x {
            color: #ff0000;
            font-size: 20rem;
            font-weight: bold;
            text-shadow: 0px 0px 50px rgba(255, 0, 0, 1), 0 0 100px #ff0000;
            line-height: 1;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Botones inferiores */
        .controls {
            margin-top: auto;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-top: 2px solid #00ffff;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin: 0 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        button:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 15px #00ffff;
        }

        .btn-strike {
            border-color: #ff0000;
            color: #ff6666;
        }
        
        .btn-strike:hover {
            background: #ff0000;
            color: white;
            box-shadow: 0 0 15px #ff0000;
        }
    </style>
</head>
<body>

    <audio id="sonidoCorrecto" src="correcto-100-mexicanos-dijeron.mp3"></audio>

        let indiceRonda = 0;
        let puntosAcumulados = 0;
        let puntosEquipo1 = 0;
        let puntosEquipo2 = 0;
        let strikesActuales = 0;

        function cargarRonda() {
            const board = document.getElementById('board');
            board.innerHTML = ''; 
            puntosAcumulados = 0;
            strikesActuales = 0;
            
            const preguntaActual = preguntas[indiceRonda];
            document.getElementById('rondaActual').innerText = indiceRonda + 1;
            document.getElementById('preguntaTexto').innerText = preguntaActual.pregunta;

            preguntaActual.respuestas.forEach((resp, index) => {
                const contenedor = document.createElement('div');
                contenedor.className = 'answer-container';
                contenedor.onclick = () => revelarRespuesta(contenedor, resp.puntos);
                
                contenedor.innerHTML = `
                    <div class="flipper">
                        <div class="front">
                            <div class="number">${index + 1}</div>
                        </div>
                        <div class="back">
                            <span class="answer-text">${resp.texto}</span>
                            <span class="points-badge">${resp.puntos}</span>
                        </div>
                    </div>
                `;
                board.appendChild(contenedor);
            });
        }

        function revelarRespuesta(elemento, puntos) {
            if (!elemento.classList.contains('flipped')) {
                elemento.classList.add('flipped');
                puntosAcumulados += puntos;
                
                // Reproducir sonido de acierto
                let audioBien = document.getElementById('sonidoCorrecto');
                audioBien.currentTime = 0; 
                audioBien.play();
            }
        }

        function lanzarStrike() {
            strikesActuales++;
            if (strikesActuales > 3) strikesActuales = 3;

            let equis = "";
            for(let i=0; i<strikesActuales; i++){ equis += "❌"; }
            
            const overlay = document.getElementById('strike-overlay');
            const textoStrike = document.getElementById('strike-text');
            
            textoStrike.innerText = equis;
            overlay.style.display = 'flex';
            
            let audioMal = document.getElementById('sonidoError');
            audioMal.currentTime = 0;
            audioMal.play();
            
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 1800);
        }

        function tocarJenni() {
            const audio = document.getElementById('musicaJenni');
            if (audio.paused) {
                audio.volume = 0.6; 
                audio.play();
            } else {
                audio.pause();
                audio.currentTime = 0;
            }
        }

        function sumarPuntos(equipo) {
            if(puntosAcumulados === 0) return;

            if (equipo === 1) {
                puntosEquipo1 += puntosAcumulados;
                document.getElementById('score1').innerText = puntosEquipo1;
            } else {
                puntosEquipo2 += puntosAcumulados;
                document.getElementById('score2').innerText = puntosEquipo2;
            }
            puntosAcumulados = 0; 
        }

        function siguienteRonda() {
            if (indiceRonda < preguntas.length - 1) {
                indiceRonda++;
                cargarRonda();
            } else {
                alert("¡FIN DEL JUEGO! Puntos Finales:\nEquipo 1: " + puntosEquipo1 + "\nEquipo 2: " + puntosEquipo2);
            }
        }

        window.onload = cargarRonda;
            document.getElementById('categoriaActual').innerText = preguntaActual.categoria;

</body>
</html>
